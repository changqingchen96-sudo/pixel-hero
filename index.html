
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>像素勇者：无限冒险 V3.0</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#17251d;color:white;font-family:Arial,"Microsoft YaHei",sans-serif;text-align:center;overflow-x:hidden}
header{padding:12px;background:#263e30}
h2{margin:3px;color:#ffe58a;font-size:20px}
#stats{font-size:13px;line-height:2}
#game{display:block;width:100%;max-width:700px;height:55vh;min-height:300px;margin:auto;background:#477c42;touch-action:none}
.controls{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;padding:10px}
button{border:0;border-radius:9px;padding:11px 15px;background:#d99b42;color:#231b10;font-weight:bold;font-size:14px}
button:active{transform:scale(.95)}
#stick{width:120px;height:120px;border-radius:50%;background:#344d3d;border:3px solid #9ab98a;position:relative;margin:8px auto;touch-action:none}
#knob{width:45px;height:45px;border-radius:50%;background:#e9d58d;position:absolute;left:35px;top:35px}
#panel{display:none;background:#263e30;border:2px solid #d9b65f;border-radius:12px;padding:14px;margin:5px auto;max-width:500px;width:95%}
#panel h3{color:#ffe58a}
.item{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px;border-bottom:1px solid #60785e;text-align:left}
.item button{padding:8px}
small{color:#c8d8c3}
</style>
</head>
<body>
<header>
<h2>⚔️ 像素勇者：无限冒险 V3.0</h2>
<div id="stats">等级 1 | 生命 100 | 金币 0 | 经验 0</div>
<div id="info">地图：绿色森林</div>
</header>

<canvas id="game"></canvas>

<div class="controls">
<button onclick="openPanel('shop')">🏪 商店</button>
<button onclick="openPanel('bag')">🎒 背包</button>
<button onclick="openPanel('maps')">🗺️ 地图</button>
<button onclick="usePotion()">❤️ 药水</button>
<button onclick="lightning()">⚡ 雷电</button>
<button onclick="saveGame()">💾 存档</button>
</div>

<div id="stick"><div id="knob"></div></div>

<div id="panel"></div>

<div class="controls">
<button onclick="closePanel()">关闭菜单</button>
<button onclick="resetGame()">重新开始</button>
</div>

<script>
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");
const panel=document.getElementById("panel");

let W=700,H=420;
function resize(){
 W=canvas.width=700;
 H=canvas.height=Math.max(300,Math.min(500,innerHeight*.55));
}
resize();

const maps=[
 {name:"绿色森林",bg:"#477c42",enemy:"史莱姆",hp:30,exp:10,gold:5},
 {name:"黑暗洞穴",bg:"#454454",enemy:"骷髅",hp:65,exp:22,gold:12},
 {name:"烈焰沙漠",bg:"#b77b39",enemy:"狼人",hp:110,exp:40,gold:25}
];

let player={
 x:W/2,y:H/2,lv:1,hp:100,maxHp:100,
 atk:12,def:0,exp:0,need:30,gold:0,
 points:0,potions:2,weapon:0,map:0
};

let enemies=[];
let drops=[];
let inventory=["初始木剑"];
let bossCount=0;
let lastAttack=0,lastSkill=0;
let moveX=0,moveY=0;
let paused=false,gameOver=false;
let messageText="",messageTime=0;

function message(t){
 messageText=t;
 messageTime=Date.now()+1800;
}

function spawnEnemy(boss=false){
 let m=maps[player.map];
 let e={
 x:Math.random()*(W-100)+50,
 y:Math.random()*(H-100)+50,
 hp:boss?m.hp*6:m.hp+player.lv*5,
 maxHp:boss?m.hp*6:m.hp+player.lv*5,
 boss:boss,
 name:boss?"🔥地图BOSS":m.enemy,
 atk:boss?15:5+player.lv,
 speed:boss?0.65:0.45
 };
 enemies.push(e);
 if(boss)message("⚠️ BOSS出现了！");
}

function initEnemies(){
 enemies=[];
 for(let i=0;i<5;i++)spawnEnemy();
 if(bossCount<Math.floor(player.lv/5)){
 bossCount=Math.floor(player.lv/5);
 spawnEnemy(true);
 }
}

function saveGame(){
 const data={
 player:player,inventory:inventory,bossCount:bossCount
 };
 localStorage.setItem("pixelHeroV3",JSON.stringify(data));
 message("💾 存档成功！");
}

function loadGame(){
 try{
  let data=JSON.parse(localStorage.getItem("pixelHeroV3"));
  if(data&&data.player){
   player=Object.assign(player,data.player);
   inventory=data.inventory||inventory;
   bossCount=data.bossCount||0;
   message("欢迎回来，勇者！");
  }
 }catch(e){}
}

function autoSave(){
 saveGame();
}

function levelUp(){
 while(player.exp>=player.need){
  player.exp-=player.need;
  player.lv++;
  player.need=Math.floor(player.need*1.35);
  player.maxHp+=15;
  player.hp=player.maxHp;
  player.atk+=2;
  player.points++;
  message("🎉 升级！获得1技能点");
 }
 if(Math.floor(player.lv/5)>bossCount){
  bossCount=Math.floor(player.lv/5);
  spawnEnemy(true);
 }
}

function attack(){
 let now=Date.now();
 if(now-lastAttack<600)return;
 let target=null,dist=Infinity;
 for(let e of enemies){
  let d=Math.hypot(e.x-player.x,e.y-player.y);
  if(d<dist){dist=d;target=e;}
 }
 if(target&&dist<90){
  lastAttack=now;
  let damage=player.atk+Math.floor(Math.random()*5);
  if(Math.random()<.15)damage*=2;
  target.hp-=damage;
  if(target.hp<=0){
   player.exp+=target.boss?100:maps[player.map].exp;
   player.gold+=target.boss?100:maps[player.map].gold;
   if(Math.random()<.25){
    drops.push({x:target.x,y:target.y,name:"强化装备",type:"weapon"});
   }
   enemies=enemies.filter(e=>e!==target);
   message("击败 "+target.name+"！");
   levelUp();
   if(enemies.length<5)spawnEnemy();
  }
 }
}

function lightning(){
 let now=Date.now();
 if(now-lastSkill<4000){
  message("雷电技能冷却中！");
  return;
 }
 lastSkill=now;
 let hit=0;
 enemies.forEach(e=>{
  if(Math.hypot(e.x-player.x,e.y-player.y)<180){
   e.hp-=player.atk*3;
   hit++;
  }
 });
 enemies=enemies.filter(e=>{
  if(e.hp<=0){
   player.exp+=e.boss?100:maps[player.map].exp;
   player.gold+=e.boss?100:maps[player.map].gold;
   return false;
  }
  return true;
 });
 levelUp();
 message("⚡ 雷电击中 "+hit+" 个敌人！");
}

function usePotion(){
 if(player.potions<=0){
  message("药水不足，请去商店购买！");
  return;
 }
 if(player.hp>=player.maxHp){
  message("生命值已经满了！");
  return;
 }
 player.potions--;
 player.hp=Math.min(player.maxHp,player.hp+50);
 message("恢复50点生命！");
}

function openPanel(type){
 paused=true;
 panel.style.display="block";
 if(type==="shop")showShop();
 if(type==="bag")showBag();
 if(type==="maps")showMaps();
}

function closePanel(){
 panel.style.display="none";
 paused=false;
}

function showShop(){
 panel.innerHTML=`
 <h3>🏪 勇者商店</h3>
 <div class="item"><span>⚔️ 铁剑（攻击+8）<br><small>价格：50金币</small></span><button onclick="buy('sword')">购买</button></div>
 <div class="item"><span>❤️ 生命药水<br><small>价格：15金币</small></span><button onclick="buy('potion')">购买</button></div>
 <div class="item"><span>🛡️ 防御护甲（防御+3）<br><small>价格：60金币</small></span><button onclick="buy('armor')">购买</button></div>
 <p>当前金币：${player.gold}</p>`;
}

function buy(type){
 if(type==="sword"&&player.gold>=50){
  player.gold-=50;player.atk+=8;player.weapon++;
  inventory.push("铁剑");
  message("购买铁剑成功！");
 }else if(type==="potion"&&player.gold>=15){
  player.gold-=15;player.potions++;
  inventory.push("生命药水");
  message("药水购买成功！");
 }else if(type==="armor"&&player.gold>=60){
  player.gold-=60;player.def+=3;
  inventory.push("防御护甲");
  message("护甲购买成功！");
 }else{
  message("金币不足！");
 }
 showShop();
 updateStats();
}

function showBag(){
 panel.innerHTML=`<h3>🎒 我的背包</h3>
 <p>金币：${player.gold} | 药水：${player.potions}</p>
 <p>攻击力：${player.atk} | 防御力：${player.def}</p>
 <p>装备列表：</p>
 ${inventory.map(x=>`<div class="item">${x}</div>`).join("")}
 <p>技能点：${player.points}</p>
 <button onclick="upgrade('atk')">攻击 +1</button>
 <button onclick="upgrade('def')">防御 +1</button>
 <button onclick="upgrade('hp')">生命 +10</button>`;
}

function upgrade(type){
 if(player.points<=0){message("技能点不足！");return;}
 player.points--;
 if(type==="atk")player.atk++;
 if(type==="def")player.def++;
 if(type==="hp"){player.maxHp+=10;player.hp+=10;}
 showBag();
 updateStats();
}

function showMaps(){
 panel.innerHTML=`<h3>🗺️ 冒险地图</h3>
 ${maps.map((m,i)=>`<div class="item">
 <span>${m.name}<br><small>怪物：${m.enemy}</small></span>
 <button onclick="changeMap(${i})">${player.map===i?"当前地图":"前往"}</button>
 </div>`).join("")}`;
}

function changeMap(i){
 if(i>player.map&&player.lv<i*3+1){
  message("等级不足，先升级！");
  return;
 }
 player.map=i;
 player.x=W/2;player.y=H/2;
 initEnemies();
 document.getElementById("info").textContent="地图："+maps[i].name;
 closePanel();
 message("进入 "+maps[i].name);
}

function resetGame(){
 if(!confirm("确定删除存档并重新开始吗？"))return;
 localStorage.removeItem("pixelHeroV3");
 location.reload();
}

function updateStats(){
 document.getElementById("stats").textContent=
 `等级 ${player.lv} | ❤️ ${Math.floor(player.hp)}/${player.maxHp} | 金币 ${player.gold} | 经验 ${player.exp}/${player.need} | 技能点 ${player.points}`;
 document.getElementById("info").textContent="地图："+maps[player.map].name;
}

function draw(){
 ctx.fillStyle=maps[player.map].bg;
 ctx.fillRect(0,0,W,H);

 // 地面像素装饰
 for(let i=0;i<35;i++){
  let x=(i*97)%W,y=(i*61)%H;
  ctx.fillStyle=player.map===0?"#5b914c":player.map===1?"#555365":"#d29b53";
  ctx.fillRect(x,y,5,5);
 }

 // 掉落装备
 drops.forEach(d=>{
  ctx.fillStyle="#ffe36b";
  ctx.fillRect(d.x-7,d.y-7,14,14);
  ctx.fillStyle="white";
  ctx.font="11px Arial";
  ctx.fillText("装备",d.x-13,d.y-13);
 });

 // 怪物
 enemies.forEach(e=>{
  ctx.fillStyle=e.boss?"#a31f37":player.map===1?"#d0d0d0":player.map===2?"#a45b36":"#4be0a1";
  ctx.fillRect(e.x-13,e.y-13,e.boss?30:24,e.boss?30:24);
  ctx.fillStyle="white";
  ctx.font="12px Arial";
  ctx.fillText(e.boss?"BOSS":e.name,e.x-20,e.y-20);
  ctx.fillStyle="#222";
  ctx.fillRect(e.x-17,e.y-29,35,5);
  ctx.fillStyle="#ed4444";
  ctx.fillRect(e.x-17,e.y-29,35*Math.max(0,e.hp/e.maxHp),5);
 });

 // 勇者
 ctx.fillStyle="#f4d17a";
 ctx.fillRect(player.x-11,player.y-11,22,22);
 ctx.fillStyle="#283fbc";
 ctx.fillRect(player.x-8,player.y-2,16,12);
 ctx.fillStyle="#fff";
 ctx.fillRect(player.x-5,player.y-7,4,4);
 ctx.fillRect(player.x+2,player.y-7,4,4);

 if(messageTime>Date.now()){
  ctx.fillStyle="white";
  ctx.font="bold 18px Arial";
  ctx.textAlign="center";
  ctx.fillText(messageText,W/2,30);
  ctx.textAlign="left";
 }
}

function update(){
 if(!paused&&!gameOver){
  player.x+=moveX*3;
  player.y+=moveY*3;
  player.x=Math.max(15,Math.min(W-15,player.x));
  player.y=Math.max(15,Math.min(H-15,player.y));

  // 自动攻击
  attack();

  // 怪物靠近勇者时攻击
  enemies.forEach(e=>{
   let dx=player.x-e.x,dy=player.y-e.y;
   let d=Math.hypot(dx,dy);
   if(d>27){
    e.x+=dx/d*e.speed;
    e.y+=dy/d*e.speed;
   }else{
    if(Math.random()<.025){
     player.hp-=Math.max(1,e.atk-player.def);
     if(player.hp<=0){
      player.hp=0;gameOver=true;
      message("勇者倒下了！刷新页面可读取存档");
     }
    }
   }
  });

  // 自动拾取装备
  drops=drops.filter(d=>{
   if(Math.hypot(d.x-player.x,d.y-player.y)<25){
    player.atk+=5;
    inventory.push("强化装备（攻击+5）");
    message("拾取装备！攻击力+5");
    return false;
   }
   return true;
  });
 }
 updateStats();
 draw();
 requestAnimationFrame(update);
}

// 虚拟摇杆
const stick=document.getElementById("stick");
const knob=document.getElementById("knob");
let active=false;
function joystick(e){
 let r=stick.getBoundingClientRect();
 let x=e.clientX-(r.left+r.width/2);
 let y=e.clientY-(r.top+r.height/2);
 let len=Math.hypot(x,y);
 if(len>35){x=x/len*35;y=y/len*35;}
 knob.style.left=(35+x)+"px";
 knob.style.top=(35+y)+"px";
 moveX=x/35;moveY=y/35;
}
stick.addEventListener("pointerdown",e=>{
 active=true;stick.setPointerCapture(e.pointerId);joystick(e);
});
stick.addEventListener("pointermove",e=>{
 if(active)joystick(e);
});
function stopStick(){
 active=false;moveX=0;moveY=0;
 knob.style.left="35px";knob.style.top="35px";
}
stick.addEventListener("pointerup",stopStick);
stick.addEventListener("pointercancel",stopStick);

// 电脑键盘也能移动
document.addEventListener("keydown",e=>{
 if(e.key==="ArrowUp"||e.key==="w")moveY=-1;
 if(e.key==="ArrowDown"||e.key==="s")moveY=1;
 if(e.key==="ArrowLeft"||e.key==="a")moveX=-1;
 if(e.key==="ArrowRight"||e.key==="d")moveX=1;
});
document.addEventListener("keyup",e=>{
 if(["ArrowUp","ArrowDown","w","s"].includes(e.key))moveY=0;
 if(["ArrowLeft","ArrowRight","a","d"].includes(e.key))moveX=0;
});

loadGame();
initEnemies();
update();
setInterval(saveGame,20000);
</script>
</body>
</html>
